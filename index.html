<script>/* phones: the prototype is drawn at 375×812 — scale it to the phone's width so it fills the screen exactly
   (no white strip on wider phones, nothing running past the bottom bar on taller ones) */
(function fitPhone(){ function fit(){ var s=document.getElementById('screen'); if(!s) return; var w=innerWidth;
  if (w > 520) { s.style.width=''; s.style.height=''; s.style.transform=''; document.body.style.overflow=''; return; }
  var k=w/375; s.style.width='375px'; s.style.height=(innerHeight/k)+'px'; s.style.transform='scale('+k+')'; s.style.transformOrigin='0 0'; document.body.style.overflow='hidden'; }
  addEventListener('resize', fit); fit(); })();</script>
<script src="switcher.js"></script>
<script>/* iteration 1's search query: a pill 8px left of its "1", centred on it */
(function pinQuery(){ var q=document.querySelector('.qhint'), v=document.getElementById('vswitch'), b=v && v.querySelector('.vswitch__b[data-v="1"]'); if(!q||!b) return;
  function pin(){ var r=b.getBoundingClientRect(), n=v.getBoundingClientRect(); if(!r.height) return; q.style.top=(r.top+r.height/2)+'px'; q.style.left=(n.left-8)+'px'; }
  addEventListener('resize', pin); pin(); })();</script>
